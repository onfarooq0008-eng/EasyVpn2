name: Build EasyVPN APK

# Runs automatically every time you push code to GitHub.
# No PC/Android Studio needed -- GitHub's cloud servers do the build.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you also click "Run workflow" manually in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pinned to a version known to work with AGP 8.13.2 + Kotlin 2.4.0 below.
          # Without this, the action grabs the newest Gradle release, which can be
          # ahead of what our Android/Kotlin plugin versions support and breaks
          # the build in confusing ways (e.g. "unresolved reference: let").
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Upload test results (only runs if tests failed, for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyVPN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
